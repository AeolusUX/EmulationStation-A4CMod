name: Build EmulationStation

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            cmake \
            pkg-config \
            libsdl2-dev \
            libsdl2-mixer-dev \
            libcurl4-openssl-dev \
            libfreetype6-dev \
            libfreeimage-dev \
            rapidjson-dev \
            libasound2-dev \
            libvlc-dev \
            libcec-dev

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake .. \
            -DSCREENSCRAPER_DEV_LOGIN="devid=${{ secrets.SS_DEVID }}&devpassword=${{ secrets.SS_DEVPASSWORD }}" \
            -DSCREENSCRAPER_SOFTNAME="EmulationStation-A4CMod"

      - name: Build
        run: |
          cd build
          make -j$(nproc)

      - name: Locate binary
        run: |
          echo "Looking for emulationstation..."
          find . -type f -name "emulationstation" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: emulationstation
          path: |
            emulationstation
            build/emulationstation
          if-no-files-found: error